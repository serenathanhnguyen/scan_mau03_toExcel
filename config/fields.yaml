  kskdk_xnnt_protein:    {source: pdf, type: text, ask: "Nước tiểu: Protein; Negative -> 'negative'; nếu có số thì ghi số (đơn vị trên phiếu)."}
  kskdk_xnnt_glucose:    {source: pdf, type: text, ask: "Nước tiểu: Glucose; Negative -> 'negative'."}
  kskdk_xnnt_cetonic:    {source: pdf, type: text, ask: "Nước tiểu: Ketone; Negative -> 'negative'."}
  kskdk_xnnt_bilirubin:  {source: pdf, type: text, ask: "Nước tiểu: Bilirubin; Negative -> 'negative'."}
  kskdk_xnnt_urobilinogen: {source: pdf, type: text, ask: "Nước tiểu: Urobilinogen; Normal -> 'normal'."}
