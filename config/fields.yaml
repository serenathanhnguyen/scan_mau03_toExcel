  xet_nghiem_te_bao_co_tu_cung: {source: pdf, type: text, ask: "Nữ lao động: XN tế bào cổ tử cung/HPV (nếu ghi)."}
  xet_nghiem_hpv:        {source: skip}
  xquang_nhu:            {source: pdf, type: text, ask: "X-quang nhũ (nếu ghi)."}
  sieu_am_2_tuyen_vu:    {source: pdf, type: text, ask: "Siêu âm 02 tuyến vú (nếu ghi)."}

  # ---------------- KẾT LUẬN ----------------
  danh_muc_de_nghi:
    source: pdf
    type: choice
    choices:
      "Bình thường, hẹn khám định kỳ lần sau": "Bình thường / tái khám định kỳ"
      "Có yếu tố nguy cơ, cần theo dõi thêm": "Có yếu tố nguy cơ, cần theo dõi thêm"
      "Đã có bệnh mạn tính, tiếp tục điều trị theo phác đồ/toa cũ": "Đã có bệnh mạn tính, tiếp tục điều trị"
      "Chuyển tuyến, khám chuyên khoa": "Chuyển tuyến / khám chuyên khoa"
      "Khác": "Khác"
    default: sample
    ask: "Mục V.3 'Đề nghị' ở trang Kết luận (kể cả chữ trong con dấu như 'TÁI KHÁM ĐỊNH KỲ')."
  denghi_chuyentuyen_ghiro: {source: pdf, type: text, ask: "Chỉ khi đề nghị chuyển tuyến/khám chuyên khoa: nội dung ghi rõ."}
  de_nghi:
    source: pdf
    type: text
    default: sample
    ask: "Nội dung chữ ở mục V.3 'Đề nghị' (kể cả chữ trong con dấu), ví dụ 'Tái khám định kỳ'."

